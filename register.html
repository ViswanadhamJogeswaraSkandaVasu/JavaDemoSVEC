<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register Page</title>
  <style>
    body {
      font-family: Georgia, 'Times New Roman', Times, serif;
      background:rgb(82, 77, 77);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      background: #0b0a0be6;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(236, 233, 233, 0.9);
      width: 320px;
      color: #fff;
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #fff;
    }

    .login-container input[type="text"],
    .login-container input[type="password"],
    .login-container input[type="number"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .login-container label {
      display: block;
      margin-bottom: 5px;
    }

    .gender-group {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .gender-group label {
      display: flex;
      align-items: center;
    }

    .login-container button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .login-container button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <form>
      <h2>Register Form</h2>

      <label for="fname">First Name:</label>
      <input type="text" id="fname" name="fname" placeholder="Don't use symbols" required />

      <label for="lname">Last Name:</label>
      <input type="text" id="lname" name="lname" placeholder="Don't use symbols" required />

      <label for="mobnumber">Mobile Number:</label>
      <input type="Mobile Number" id="mn" name="mn" placeholder="Enter a Mobile Number" required />

      <label for="age">Age:</label>
      <input type="number" id="age" name="age" placeholder="Enter your age" required />

      <label>Gender:</label>
      <div class="gender-group">
        <label><input type="radio" name="gender" value="Male" required /> Male</label>
        <label><input type="radio" name="gender" value="Female" /> Female</label>
        <label><input type="radio" name="gender" value="Others" /> Others</label>
        </div>

    <label for="address">Address:</label>
<textarea id="address" name="address" placeholder="Enter your address here" rows="3" required></textarea>

      

      <button type="submit"><a href="index4.html" >Register</a></button>
    </form>
  </div>

</body>
</html>
